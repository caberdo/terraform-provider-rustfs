services:
  test:
    # Digest-pinned: the dev-only toolchain image should not change under the
    # test job. The tag stays alongside it so the Go version remains readable.
    image: golang:1.27@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8
    volumes:
      - ..:/workspaces/terraform-provider-rustfs
      - go-modules:/go/pkg/mod
      - terraform-bin:/usr/local/terraform
    working_dir: /workspaces/terraform-provider-rustfs
    command:
      - bash
      - -c
      - |
        TERRAFORM_VERSION=1.11.4
        # Match the container architecture: Apple Silicon runners/contributors
        # run linux/arm64, where a linux_amd64 Terraform cannot execute.
        TERRAFORM_ARCH=$$(dpkg --print-architecture)
        TERRAFORM_DIR=/usr/local/terraform/$${TERRAFORM_ARCH}
        TERRAFORM_BIN=$${TERRAFORM_DIR}/terraform
        if [ -x "$$TERRAFORM_BIN" ]; then
          echo "Using cached Terraform $$TERRAFORM_VERSION ($$TERRAFORM_ARCH)..."
        else
          echo "Downloading Terraform $$TERRAFORM_VERSION ($$TERRAFORM_ARCH)..."
          apt-get update -qq && apt-get install -y -qq unzip wget >/dev/null 2>&1
          wget -q -O /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$${TERRAFORM_VERSION}/terraform_$${TERRAFORM_VERSION}_linux_$${TERRAFORM_ARCH}.zip"
          mkdir -p "$$TERRAFORM_DIR"
          unzip -o /tmp/terraform.zip -d "$$TERRAFORM_DIR"
          rm /tmp/terraform.zip
        fi
        ln -sf $$TERRAFORM_BIN /usr/local/bin/terraform
        terraform version
        go mod download
        go build ./...
        # Coverage is collected here so the acceptance suite can be cited as
        # evidence for the statement-coverage criteria of the OpenSSF Best
        # Practices badge (.github/OPENSSF-BEST-PRACTICES.md): the unit suite
        # alone reads ~22% in ./provider because that package asserts its
        # behaviour end-to-end against a real server.
        TF_ACC=1 go test -v -failfast -timeout 30m \
          -covermode=atomic -coverprofile=coverage-acceptance.out -coverpkg=./... \
          ./provider $${TEST_FILTER:+-run $$TEST_FILTER}
        status=$$?
        if [ -f coverage-acceptance.out ]; then
          echo "Acceptance coverage (covered statements, ./... ):"
          go tool cover -func=coverage-acceptance.out | tail -1
        fi
        exit $$status
    environment:
      TF_ACC: "1"
      # The pinned toolchain image ships an older Go than go.mod requires; let
      # it fetch the matching toolchain instead of failing on GOTOOLCHAIN=local.
      GOTOOLCHAIN: "auto"
      RUSTFS_ENDPOINT: "rustfs:9001"
      RUSTFS_USER: "rustfsadmin"
      RUSTFS_SECRET: "rustfsadmin"
      RUSTFS_NOTIFY_TEST_ENDPOINT: "http://127.0.0.1:9001/health/ready"
      # Second RustFS instance used as the replication peer for
      # TestAccRemoteTargetResource and TestAccBucketReplicationResource.
      # RUSTFS_PEER_ENDPOINT is the peer's S3 data API as the primary server
      # reaches it (a remote target replicates over S3); the admin and S3
      # endpoints the test container uses follow. `rustfs_tier` needs a remote
      # backend to probe as well, and a tier may not point at the deployment
      # itself (the probe fails with "outcome is uncertain"), so it points at
      # the same peer.
      RUSTFS_TIER_ENDPOINT: "http://rustfs-peer:9000"
      RUSTFS_PEER_ENDPOINT: "rustfs-peer:9000"
      RUSTFS_PEER_ADMIN_ENDPOINT: "rustfs-peer:9001"
      RUSTFS_PEER_S3_ENDPOINT: "rustfs-peer:9000"
      RUSTFS_PEER_ACCESS_KEY: "rustfsadmin"
      RUSTFS_PEER_SECRET_KEY: "rustfsadmin"
      # Second site for TestAccSiteReplicationResource: the peer above, as
      # *RustFS* sees it. It needs a scheme because it is handed to the server
      # as a site endpoint (RUSTFS_PEER_ENDPOINT is host:port for an S3 target),
      # and it must not be a loopback address: site-replication/add refuses one
      # and records the local site from the Host header of the admin request, so
      # a host-side run against a published port cannot form the group.
      RUSTFS_SITE_REPLICATION_PEER_ENDPOINT: "http://rustfs-peer:9000"
      # Native-TLS listener for rustfs_tls_certificate. The other instances
      # serve plain HTTP, where RustFS refuses certificate management.
      RUSTFS_TLS_ENDPOINT: "rustfs-tls:9001"
      # Optional happy-path inputs for the KMS acceptance tests. They only take
      # effect on a deployment whose KMS backend supports the operation (Vault
      # for rekey, RUSTFS_KMS_BACKUP_DIR et al. for backup); every stock cell
      # reports the capability as absent and those cases skip with the server's
      # reason. Empty by default so a stock run is unchanged.
      RUSTFS_ACC_KMS_REKEY_BUCKET: "${RUSTFS_ACC_KMS_REKEY_BUCKET:-}"
      RUSTFS_ACC_KMS_BACKUP_ID: "${RUSTFS_ACC_KMS_BACKUP_ID:-}"
      TEST_FILTER: "${TEST_FILTER:-TestAcc}"
    depends_on:
      rustfs:
        condition: service_started
      rustfs-peer:
        condition: service_started
      rustfs-tls:
        condition: service_started
    profiles:
      - test

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # The notify and audit feature modules are intentionally NOT pinned with
      # RUSTFS_NOTIFY_ENABLE/RUSTFS_AUDIT_ENABLE here: RustFS then rejects every
      # admin API update to those modules, which breaks the acceptance tests
      # (TestAccModuleSwitchResource, and the target prechecks). The audit and
      # notification target tests enable their own module through the admin API
      # and restore it afterwards.
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: "http://127.0.0.1:9001"
      RUSTFS_KMS_ENABLE: "true"
      RUSTFS_KMS_BACKEND: "local"
      RUSTFS_KMS_KEY_DIR: "/data/kms"
      RUSTFS_KMS_LOCAL_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RUSTFS_KMS_DEFAULT_KEY_ID: "rustfs-default-key"
      RUSTFS_KMS_ALLOW_INSECURE_DEV_DEFAULTS: "true"

  # Destination peer for remote-target and bucket-replication tests, and the
  # backend `rustfs_tier` probes (a tier cannot point at the deployment itself).
  # Inside the compose network the primary server and the test container address
  # it by the service name; the published ports are for `make testacc-live`,
  # which runs the suite on the host. Its storage is ephemeral like the primary
  # instance's.
  rustfs-peer:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin

  # Generates the ephemeral certificate pair the TLS fixture serves, so no
  # private key is committed to the repository. The output lands in the ignored
  # acc_test/tls directory, which both rustfs-tls and the test process mount.
  tls-certgen:
    image: golang:1.27@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8
    working_dir: /workspaces/terraform-provider-rustfs/acc_test/tlscertgen
    volumes:
      - ..:/workspaces/terraform-provider-rustfs
    command:
      - go
      - run
      - .
      - /workspaces/terraform-provider-rustfs/acc_test/tls
    environment:
      # go.mod requires go 1.27.3; let the image fetch that toolchain if its
      # bundled Go is older, matching the test service.
      GOTOOLCHAIN: auto

  # Native-TLS listener for rustfs_tls_certificate. RustFS only accepts
  # certificate publication on a listener it serves TLS from, and only when a
  # private publication directory is configured outside the TLS material path.
  # The publication directory is a named volume because RustFS requires it to
  # be 0700 and owned by the process, which a bind mount checked into git cannot
  # guarantee.
  rustfs-tls:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    user: root
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        chmod 700 /tls-publish &&
        exec /entrypoint.sh rustfs
    depends_on:
      tls-certgen:
        condition: service_completed_successfully
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - ./tls:/tls-src:ro
      - rustfs-tls-publish:/tls-publish
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_TLS_PATH: /tls-src
      RUSTFS_TLS_PUBLISH_DIR: /tls-publish
      RUSTFS_TLS_RELOAD_ENABLE: "true"
      RUSTFS_TLS_RELOAD_INTERVAL: "5"
      RUSTFS_TRUST_LEAF_CERT_AS_CA: "false"
      RUSTFS_SERVER_MTLS_ENABLE: "false"

volumes:
  go-modules:
  terraform-bin:
  rustfs-tls-publish:
