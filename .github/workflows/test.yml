# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit, except the
# fragment-union example validator, which has no kit equivalent (see the
# `examples` job below).
name: Test

on:
  push:
    branches: [main]
    # docs.yml ran its markdown link check on a release tag as well; folding it
    # into this caller keeps that trigger. The docs job also checks the tagged
    # tree, which is harmless (the tag points at a commit main already checked).
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The repository's ruleset uses a merge queue, which builds the merged result
  # under a merge_group event. Without this trigger the queue would wait for
  # required checks that never report.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.13.0
    # GitHub validates a caller's grant against every job of the called workflow
    # before any `if:` or input is evaluated, so these are the union of what
    # provider-ci declares, not what this run happens to execute:
    #
    # - `contents: write` + `pull-requests: write`: requested unconditionally by
    #   the called `docs` job. Omitting them rejects the whole run with "The
    #   nested job 'docs' is requesting 'contents: write, pull-requests: write'".
    # - `security-events: write`: the `Lint & Security` job uploads gosec SARIF
    #   to code scanning.
    #
    # This does not widen the token any other job runs with: every other job in
    # provider-ci.yml re-declares `contents: read` (and nothing else), and a
    # called job can narrow the caller's grant, never widen it.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    with:
      provider: rustfs
      provider-display: RustFS
      module: github.com/caberdo/terraform-provider-rustfs
      # RustFS's packages are `provider` and `pkg/rustfs`, not `./internal/...`.
      packages: ./...
      # Pinned so CI and local runs agree on the linter set and gofmt behaviour.
      golangci-config: .golangci.yml
      golangci-version: v2.14.0
      # The old job used the action's default binary install; only the version
      # was pinned in the repository.
      golangci-install-mode: binary
      # gosec v2.29.0 cannot decode the export data of the Go 1.27 toolchain, so
      # it is built from the pinned source in .github/gosec (a nested module)
      # with a tool-only x/tools override.
      gosec-mode: nested-module
      # The old job installed govulncheck and ran it in its own
      # `Vulnerability Scan` job. `script` would move it into Lint & Security.
      govuln-mode: install
      vuln-timeout: 10
      # Neither check ran in the old test job: `go build ./...` covered the host
      # platform only and nothing verified go.mod was tidy.
      tidy-check: false
      cross-build: false
      # The old setup-terraform step pinned no version, so use the newest
      # release. This feeds the docs job, which needs Terraform for tfplugindocs.
      terraform-version: ""
      # require-terraform only guards the kit's own examples step, which this
      # caller disables below.
      require-terraform: false
      # tfkit's examples validator checks each fragment directory as a module,
      # but 78 of rustfs's 100 snippets reference a resource or data source
      # declared in another snippet. The local scripts/validate-examples.py
      # unions them into one synthetic module (with stubs), so the example job
      # below keeps that behaviour instead of losing the check.
      examples: false
      # The newest changelog section names the version: `tfkit release check`
      # compares it with the README install constraint and reports the last tag
      # beside the verdict (pending release / released), never requiring it.
      # The changelog is assembled from changelog.d/ fragments by
      # scripts/changelog-release.sh, and the fragment convention is enforced
      # by this caller.
      changelog: true
      # Every pull request that can change what a user sees carries a fragment
      # in changelog.d/ instead of editing CHANGELOG.md.
      changelog-fragments: true
      # docs.yml's `Generate Docs` job failed on drift on every pull request and
      # on main; docs-mode: drift keeps that check in the docs job, so the
      # context stays `ci / Generate Docs` rather than moving into Test.
      docs: true
      docs-mode: drift
      docs-drift-in-test: false
      # docs.yml's `Validate Markdown Files` job.
      markdown: true
      # Replay the committed fuzz seed corpora without exploring new inputs. The
      # weekly mutating matrix stays in fuzz.yml: provider-ci only replays seeds.
      fuzz: true
      # The old Coverage job ran only on pull requests and gated the merged
      # unit + acceptance profile, so the unit profile alone must not gate.
      coverage-job: pull_request
      coverage-merged: true
      coverage-timeout: 30
      coverage-gate-in-test: false
      coverage-readme: true
      # Both the Coverage job and the acceptance matrix wrote coverage-unit.out;
      # the Test job now produces it once under the same name.
      unit-profile: coverage-unit.out
      coverage-note: "Unit tests only: the acceptance suite skips itself without `TF_ACC`, so packages whose behaviour is covered by `TestAcc*` (mostly `provider`) read low. Run `make coverage` locally, or see the acceptance job for the live suite."
      acceptance-compose: docker compose -f acc_test/docker-compose.yml --profile test run --rm test
      # Read on main only; provider-acceptance parses the same file itself.
      versions-job: true
      versions-file: .github/rustfs-versions.txt

  # rustfs's snippets are not standalone modules, and the kit has no equivalent
  # validator (see .github/workflows/validate-examples.yml). Calling that local
  # reusable workflow keeps this check in the `<caller> / <job>` shape the other
  # CI checks use, so the running context is `examples / Validate Examples` and
  # the ruleset can require it.
  examples:
    needs: ci
    uses: ./.github/workflows/validate-examples.yml
    permissions:
      contents: read

  # The old acceptance job ran only on a push to main, after `test` (which
  # included the example validation), and took its matrix from
  # .github/rustfs-versions.txt. A caller cannot express `needs.<job>.result`
  # across a reusable-workflow boundary, so `needs: [ci, examples]` is the
  # faithful spelling: a failing `ci` or example check skips acceptance, exactly
  # as a failing `test` did before. The `ci` gate is wider now (any `ci` job, not
  # just `test`).
  acceptance:
    needs: [ci, examples]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.13.0
    permissions:
      contents: read
    with:
      provider: rustfs
      provider-display: RustFS
      packages: ./...
      versions-file: .github/rustfs-versions.txt
      version-env: RUSTFS_VERSION
      # The acceptance fixture lives in acc_test/, not docker-compose.yml.
      acceptance-compose: docker compose -f acc_test/docker-compose.yml --profile test run --rm test
      # Both `logs` and `down -v` get these arguments; the trailing space is part
      # of the input's contract.
      compose-file-args: "-f acc_test/docker-compose.yml --profile test "
      # The floor is calibrated on the literal `latest` entry, and older cells
      # legitimately skip version-gated tests.
      gate-cell: literal-latest
      # The old combined-coverage step reported an incomplete profile and exited
      # 0; only the gate on the latest cell failed a run.
      fail-on-missing-acceptance-profile: false
      unit-profile: coverage-unit.out
      acceptance-timeout: 30
      # The old matrix had no cap; the file has six entries.
      max-parallel: 6
