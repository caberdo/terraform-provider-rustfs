name: Docs CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-docs:
    name: Generate Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Docs drift is reported as a failed check instead of an auto-opened PR:
    # GitHub Actions is not permitted to create pull requests in this repo
    # (Settings -> Actions -> General -> Workflow permissions), so the old
    # `gh pr create` step always failed. If auto-PRs are wanted later, enable
    # that setting (or supply a PAT) and restore the PR step.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      # Same entry point contributors use (`make generate`): the
      # //go:generate directive pins tfplugindocs and --provider-name rustfs,
      # so CI cannot drift from the committed docs.
      - name: Generate docs
        run: make generate

      - name: Fail if docs are out of date
        run: |
          if git diff --quiet -- docs/; then
            echo "Docs are up to date."
            exit 0
          fi
          echo "## Documentation is out of date" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run `make generate` and commit the regenerated `docs/`.' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat -- docs/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  mdvalidate:
    name: Validate Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Markdown Link Validation
        uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: "./.github/github-action-markdown-link-check-config.json"
