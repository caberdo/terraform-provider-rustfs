# Releasing is delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# Three entry points, all with an explicit tag:
#
# - `workflow_call`, for a workflow that has already created (or chosen) a tag;
#   `tag` is required, as it was before the migration.
# - `workflow_dispatch`, to publish or republish an existing tag. `tag` is
#   required so a dispatch that forgets it cannot silently cut and publish a
#   patch.
# - `push: tags: ["v*"]`, for a signed tag pushed from a developer machine (the
#   GPG-signed tag the release is built and attested from).
#
# Tag creation is deliberately not inferred here: there is no version file, and
# the caller always supplies the tag, so the reusable workflow's tag job never
# invents a version for this repository.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (or republish), e.g. v0.9.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

# A manual dispatch can race a merge or another dispatch. Serialise them instead
# of cancelling, so a half-created tag is never abandoned.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@v0.13.0
    # `contents: write` uploads the release; `id-token: write` mints the OIDC
    # identity `actions/attest` signs the provenance with; `attestations: write`
    # stores that provenance in the repository's attestation record. Nothing
    # else needs write access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: rustfs
      dist-prefix: terraform-provider-rustfs
      goreleaser-config: .github/goreleaser.yml
      # No version file: the newest CHANGELOG.md section names the version.
      # The kit's tag job is skipped on a tag-driven caller, and
      # `changelog-check` lives in that job; `tfkit release check` compares the
      # changelog with the README install constraint and reports the tag beside
      # the verdict.
      # The tag job's version resolution never runs when `tag` is set, so this
      # guard is inert for this caller; keep the pre-migration failure mode for
      # any future caller path that does resolve a version.
      tag-exists: fail
      tag: ${{ inputs.tag || github.event.inputs.tag }}
