# Releasing is delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# Two entry points share this workflow, as they did when the tag and the publish
# lived in `create-release-tag.yml` and `release.yml`:
#
# - A `workflow_dispatch`, for the normal release (the tag job calculates the
#   next version from `release_type` or takes `version` explicitly) and for a
#   republish of an existing tag (`tag` set). RustFS tags manually after the
#   release pull request merges, so there is no `push: branches: [main]` entry
#   point and no VERSION file to watch.
# - `push: tags: ["v*"]` stays for signed tags pushed from a developer machine:
#   tags pushed with the default GITHUB_TOKEN do not trigger other workflows, so
#   the tag job hands its own tag to the release job instead of relying on it.
#
# The GPG key and passphrase are the same two secrets as before: the tag job
# creates and verifies a signed tag with them, and GoReleaser signs the checksum
# file with the same key.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty to auto-calculate from release_type)"
        required: false
        type: string
        default: ""
      release_type:
        description: "Type of release (used when version is empty)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      tag:
        description: "Existing tag to publish (or republish), e.g. v0.9.0"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A manual dispatch can race a merge or another dispatch. Serialise them instead
# of cancelling, so a half-created tag is never abandoned.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@v0.6.0
    # `contents: write` creates the tag and uploads the release; `id-token:
    # write` mints the OIDC identity `actions/attest` signs the provenance
    # with; `attestations: write` stores that provenance in the repository's
    # attestation record. Nothing else needs write access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: rustfs
      dist-prefix: terraform-provider-rustfs
      goreleaser-config: .github/goreleaser.yml
      # No VERSION file: the release pull request is assembled from
      # changelog.d/ fragments and the tag is dispatched by hand. An empty path
      # disables the "a push changed the version file" entry point.
      version-file: ""
      # The kit's changelog check expects `## [X.Y.Z] - YYYY-MM-DD`, while
      # scripts/changelog-release.sh writes `## X.Y.Z (YYYY-MM-DD)`. The check
      # stays off; the Conventions workflow owns the changelog format.
      changelog-check: false
      # The old tag job failed when the tag already existed, and directed a
      # failed publish to the `tag` dispatch input instead.
      tag-exists: fail
      version: ${{ github.event.inputs.version }}
      release-type: ${{ github.event.inputs.release_type || 'patch' }}
      tag: ${{ github.event.inputs.tag }}
