# rustfs's example validator, as a local reusable workflow.
#
# The snippets are not standalone modules: examples/data-sources/* and many
# examples/resources/* reference a bucket or user declared by another snippet.
# scripts/validate-examples.py unions them into one synthetic module (stubbing
# any parent no fragment declares), while `tfkit examples validate` validates
# each directory in place and cannot express that union. The check therefore
# stays local.
#
# It is a `workflow_call` file rather than a job in test.yml so the check keeps
# the `<caller job> / <job name>` shape of the other CI checks: the caller job
# `examples` reports `examples / Validate Examples`. A plain job would report
# only its `name`, which is the context drift this wrapper avoids.
name: Validate Examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate examples
        run: ./scripts/validate-examples.sh
